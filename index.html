<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Urlaubsplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="leaflet.css">
<script src="trip-config.js"></script>
<style>
  /* Layout: eine Spalte; Kopfbereich mit Foto und Tageszähler, darunter Eingabe und Zeitstrahl von oben nach unten (Countdown-Checkpoints, Reisetage), dann die Box „Zur Karte“; die Karte öffnet als eigene Ansicht.
     Alles Reisespezifische steht in trip-config.js; die Farben hier sind die Grundpalette und werden dort überschrieben. */
  :root {
    --bg: #fbf6ec;          /* Sand */
    --surface: #ffffff;
    --wash: #f4ead6;
    --fg: #172a3f;          /* Navy */
    --muted: #5b6878;
    --accent: #1d4e89;      /* Pazifik-/Navyblau */
    --accent-2: #ec6f1c;    /* California Poppy */
    --line: #e7dcc7;
    --sea: #cfe3ef;
    --land: #f7f0e1;
    --land-hi: #fbe7bf;     /* goldene Hügel */
    --land-far: #ece6d9;
    --park: #d3e4c2;
    --border: #c7b593;
    --road: #c9553a;        /* rote Highway-Linien */
    --pin: #c8102e;         /* Old Glory Red */
    --idea: #1f8a8a;        /* Pazifik-Türkis für Vorschläge */
    /* Farben für Roadtrips */
    --c1: #1d4e89; --c2: #ec6f1c; --c3: #1f8a8a; --c4: #8b3a2b; --c5: #5b7f3a; --c6: #b8860b;
    --on-c: #ffffff;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1726; --surface: #16233a; --wash: #121d30; --fg: #eef2f8; --muted: #9eacbf;
      --accent: #7fb1f2; --accent-2: #ff9447; --line: #26364f;
      --sea: #0a1220; --land: #1a2537; --land-hi: #2b2719; --land-far: #141d2c; --park: #1e3427;
      --border: #3d4d66; --road: #c06a52; --pin: #ff5468; --idea: #5ccfcf;
      --c1: #7fb1f2; --c2: #ff9447; --c3: #5ccfcf; --c4: #d98a73; --c5: #a6cc7e; --c6: #e6b84a;
      --on-c: #0e1726; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1726; --surface: #16233a; --wash: #121d30; --fg: #eef2f8; --muted: #9eacbf;
    --accent: #7fb1f2; --accent-2: #ff9447; --line: #26364f;
    --sea: #0a1220; --land: #1a2537; --land-hi: #2b2719; --land-far: #141d2c; --park: #1e3427;
    --border: #3d4d66; --road: #c06a52; --pin: #ff5468; --idea: #5ccfcf;
    --c1: #7fb1f2; --c2: #ff9447; --c3: #5ccfcf; --c4: #d98a73; --c5: #a6cc7e; --c6: #e6b84a;
    --on-c: #0e1726; color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.6;
  }
  .wrap {
    max-width: 60rem; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { padding-block: 2.5rem 1.75rem; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); font-weight: 600;
  }
  h1 {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.02; margin: 0.4rem 0 1rem;
    text-wrap: balance;
  }
  h1 span { color: var(--accent-2); }
  .lead { color: var(--muted); max-width: 34rem; margin: 0; }
  main { display: grid; gap: 2.5rem; padding-block: 2.5rem 4rem; }
  section { min-width: 0; }
  h2 {
    font-family: var(--font-display); font-weight: 500; font-size: 1.5rem;
    margin: 0 0 0.75rem; text-wrap: balance;
  }
  h3.sub { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 1.75rem 0 0.6rem; }
  .placeholder {
    border: 1px dashed var(--line); border-radius: 10px; background: var(--surface);
    padding: 1rem 1.25rem; color: var(--muted);
  }
  footer { color: var(--muted); font-size: 0.85rem; padding-block: 0 2.5rem; }
  .hint { color: var(--muted); margin: 0 0 1rem; max-width: 42rem; }

  /* Eingabe */
  .add-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem 1rem 0.8rem; margin-bottom: 0.5rem; display: grid; gap: 0.75rem; }
  .fields { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; }
  .seg { display: inline-flex; justify-self: start; background: var(--wash); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg-btn { background: transparent; color: var(--muted); border: 0; border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.85rem; transition: background .2s, color .2s; }
  .seg-btn.on { background: var(--accent); color: var(--bg); }
  .seg-btn:not(.on):hover { color: var(--fg); }
  .add-hint { margin: 0; color: var(--muted); font-size: 0.8rem; }
  #act-form label { display: grid; gap: 0.25rem; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; min-width: 0; }
  #act-form .grow { flex: 2 1 16rem; }
  #act-form .mid { flex: 1 1 11rem; }
  #act-form .day-sel { flex: 1 1 9.5rem; }
  #act-form input, #act-form select, .pop select {
    font: inherit; font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.55rem 0.7rem; width: 100%; box-sizing: border-box;
  }
  button {
    font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    border-radius: 8px; padding: 0.55rem 0.95rem; border: 1px solid var(--accent);
    background: var(--accent); color: var(--bg);
  }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  #status { margin: 0 0 0.5rem; min-height: 1.6em; color: var(--muted); font-size: 0.95rem; }
  #status.warn { color: var(--pin); }

  /* Kopfbereich: Foto (TRIP.hero) mit Titel und Tageszähler */
  header.hero {
    position: relative; color: #fff; border: 0;
    display: grid; align-content: end;
    padding-block: clamp(3rem, 9vw, 5rem) clamp(1.75rem, 5vw, 3rem);
    background: var(--hero-img, linear-gradient(135deg, var(--accent), var(--accent-2))) var(--hero-pos, center 30%) / cover no-repeat, var(--fg);
  }
  header.hero.has-photo { min-height: clamp(30rem, 88vh, 46rem); }   /* mit Foto: Text unten, Gesichter oben frei */
  header.hero:not(.has-photo)::before { background: radial-gradient(120% 90% at 85% 0%, rgba(255, 255, 255, .18), transparent 60%), linear-gradient(180deg, transparent 40%, rgba(25, 12, 8, .35)); }
  header.hero::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(25, 12, 8, 0) 35%, rgba(25, 12, 8, .55) 62%, rgba(25, 12, 8, .86) 100%);
  }
  header.hero .wrap { position: relative; width: 100%; box-sizing: border-box; }
  header.hero .eyebrow { color: #ffe3c9; }
  header.hero h1 { color: #fff; text-shadow: 0 2px 22px rgba(0, 0, 0, .35); }
  header.hero h1 span { color: var(--hero-accent, #ffb27a); }
  header.hero .lead { color: rgba(255, 255, 255, .9); }
  .count { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.2rem 0.9rem; margin-top: 1.6rem; }
  .count-num { font-family: var(--font-display); font-weight: 800; font-size: clamp(3.6rem, 17vw, 6.5rem); line-height: 0.85; font-variant-numeric: tabular-nums; }
  .count-unit { font-weight: 600; font-size: 1.05rem; line-height: 1.25; max-width: 13rem; padding-bottom: 0.35rem; }
  .count-msg { flex-basis: 100%; margin: 0.55rem 0 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(1.2rem, 4.5vw, 1.6rem); text-wrap: balance; }

  /* Zeitstrahl von oben nach unten: links Datum und Linie (daneben Roadtrip-Streifen), rechts die Beschreibung */
  .vt { list-style: none; margin: 1.5rem 0 0; padding: 0; --date-w: 4.4rem; }
  .vt-row { display: grid; grid-template-columns: var(--date-w) 1.5rem var(--lanes-w, 0px) minmax(0, 1fr); column-gap: 0.55rem; scroll-margin-top: 1rem; }
  .vt-date { text-align: right; padding-top: 0.6rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .vt-date .wd { display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .vt-date .dt { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
  .vt-rail { position: relative; }
  .vt-rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--line); }
  .vt-row:first-child .vt-rail::before { top: 0.9rem; }
  .vt-row:last-child .vt-rail::before { bottom: auto; height: 0.9rem; }
  .vt-row.done .vt-rail::before { background: var(--accent); }
  .vt-dot { position: absolute; left: 50%; top: 0.75rem; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--bg); border: 2px solid var(--border); z-index: 1; box-sizing: border-box; }
  .vt-row.done .vt-dot { background: var(--accent); border-color: var(--accent); }
  .vt-row.has .vt-dot { background: var(--pin); border-color: var(--pin); }
  .vt-row.today .vt-dot { background: var(--accent-2); border-color: var(--accent-2); animation: beat 2s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-2) 35%, transparent); } 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent-2) 10%, transparent); } }
  .vt-lanes { display: grid; grid-template-columns: repeat(var(--lanes, 0), 7px); column-gap: 3px; }
  .vt-lane { background: var(--c); }
  .vt-lane.none { background: transparent; }
  .vt-lane.s { margin-top: 0.75rem; border-radius: 99px 99px 0 0; }
  .vt-lane.e { margin-bottom: 0.75rem; border-radius: 0 0 99px 99px; }
  .vt-lane.s.e { border-radius: 99px; }
  .vt-body { min-width: 0; padding-block: 0.3rem 0.85rem; }
  .vt-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: border-color .2s; }
  .vt-card.open { border-color: var(--accent); box-shadow: 0 6px 20px color-mix(in srgb, var(--fg) 8%, transparent); }
  .vt-head { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem 0.6rem; padding: 0.6rem 0.85rem; }
  .vt-head:hover .vt-more { text-decoration: underline; }
  .vt-head:focus-visible { outline: 2px solid var(--accent-2); outline-offset: -2px; border-radius: 12px; }
  .vt-title { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
  .vt-more { margin-left: auto; color: var(--accent); font-size: 0.8rem; font-weight: 600; }
  .vt-evs { list-style: none; margin: 0; padding: 0; }
  .vt-ev { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 3.1rem minmax(0, 1fr); gap: 0 0.5rem; padding: 0.45rem 0.85rem; border-top: 1px solid var(--line); }
  .vt-ev:hover { background: var(--wash); }
  .vt-ev .t { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
  .vt-ev .nm { font-weight: 600; overflow-wrap: anywhere; }
  .vt-ev .pl { grid-column: 2; color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
  .vt-ev .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 0.35rem; vertical-align: 0.1em; }
  .vt-empty { margin: 0; padding: 0 0.85rem 0.65rem; color: var(--muted); font-size: 0.9rem; }
  .vt-card .detail-card { margin: 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
  .vt-card .detail-head h4 { font-size: 1.15rem; }
  .vt-sep .vt-body { padding-top: 1.2rem; }
  .vt-sep h3 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin: 0; }
  .vt-sep p { margin: 0.1rem 0 0; color: var(--muted); }
  .vt-sep .vt-dot { width: 18px; height: 18px; margin-left: -9px; top: 1.45rem; background: var(--accent-2); border-color: var(--accent-2); }

  /* Countdown im Zeitstrahl: Heute und Checkpoints mit Fotos */
  .vt-now { background: color-mix(in srgb, var(--accent-2) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent-2) 45%, var(--line)); border-radius: 12px; padding: 0.7rem 0.9rem; }
  .vt-now b { font-family: var(--font-display); font-size: 1.6rem; color: var(--accent-2); font-variant-numeric: tabular-nums; }
  .vt-now p { margin: 0.15rem 0 0; }
  .vt-cp { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); gap: 0.9rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0.6rem 0.9rem 0.6rem 0.6rem; }
  .vt-cp.no-photo { grid-template-columns: minmax(0, 1fr); padding-left: 0.9rem; }
  .vt-cp img { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; background: var(--wash); transform: rotate(-2.5deg); box-shadow: 0 3px 10px rgba(0, 0, 0, .18); border: 3px solid #fff; box-sizing: border-box; }
  .vt-cp p { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
  .vt-cp.locked img { filter: blur(9px) saturate(.5); }
  .vt-cp.locked p { font-family: var(--font-body); font-size: 0.92rem; color: var(--muted); }
  .vt-row.current .vt-cp, .vt-card .vt-cp { border-color: var(--accent-2); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-2) 40%, transparent); }
  .vt-card .vt-cp { margin: 0 0.6rem 0.6rem; }
  @media (max-width: 560px) {
    .vt { --date-w: 3.2rem; }
    .vt-row { column-gap: 0.35rem; }
    .vt-cp { grid-template-columns: 4.6rem minmax(0, 1fr); gap: 0.7rem; }
    .vt-cp p { font-size: 1.02rem; }
  }
  #unsched { margin-top: 1rem; }
  #unsched h3 { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.4rem; font-weight: 600; }
  #unsched ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
  .item {
    width: 100%; text-align: left; display: grid; gap: 0.05rem; font-weight: 400; font-size: 0.9rem; line-height: 1.35;
    background: var(--surface); color: var(--fg); border: 1px solid var(--line); padding: 0.45rem 0.6rem;
  }
  .item:hover { border-color: var(--accent); }
  .item .nm { font-weight: 600; overflow-wrap: anywhere; }
  .item .pl { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }

  /* Box „Zur Karte“ und die Karte als eigene Ansicht */
  .to-map {
    all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 0.2rem; width: 100%; min-height: 11rem; align-content: end;
    padding: 1.4rem 1.5rem; border-radius: 16px; color: #fff; position: relative; overflow: hidden;
    background: var(--map-img, linear-gradient(135deg, var(--accent), var(--accent-2))) center 55% / cover no-repeat, var(--accent);
    box-shadow: 0 10px 30px color-mix(in srgb, var(--fg) 18%, transparent);
  }
  .to-map::before { content: ""; position: absolute; inset: 0; background: linear-gradient(200deg, rgba(20, 10, 6, 0) 20%, rgba(20, 10, 6, .72) 100%); }
  .to-map > * { position: relative; }
  .to-map .tm-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.4rem); line-height: 1; }
  .to-map .tm-sub { opacity: 0.92; }
  .to-map .tm-go { justify-self: start; margin-top: 0.6rem; background: #fff; color: var(--accent); font-weight: 600; border-radius: 99px; padding: 0.35rem 0.9rem; font-size: 0.9rem; transition: transform .15s; }
  .to-map:hover .tm-go { transform: translateX(4px); }
  .to-map:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
  body.map-open { overflow: hidden; }
  .map-view { position: fixed; inset: 0; z-index: 4000; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
  .mv-bar {
    position: sticky; top: 0; z-index: 1100; display: flex; align-items: center; gap: 0.75rem; background: var(--surface); border-bottom: 1px solid var(--line);
    padding-top: max(0.6rem, env(safe-area-inset-top, 0px)); padding-bottom: 0.6rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .mv-bar .mv-title { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; }
  .mv-body { padding-block: 0.9rem 2rem; }
  .map-view #map { height: calc(100vh - 10rem); height: calc(100dvh - 10rem); min-height: 20rem; }
  .map-status { margin: 0 0 0.5rem; min-height: 1.4em; color: var(--muted); font-size: 0.92rem; }
  .gate-photo { width: 7rem; height: 7rem; border-radius: 50%; object-fit: cover; border: 4px solid var(--surface); box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
  @media (prefers-reduced-motion: reduce) { .vt-row.today .vt-dot { animation: none; } }

  /* Detailansicht eines Tages */
  .detail { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .45s cubic-bezier(.2,.7,.2,1), opacity .3s ease; }
  .detail.open { grid-template-rows: 1fr; opacity: 1; }
  .detail-inner { overflow: hidden; min-height: 0; }
  .detail-card { margin-top: 0.75rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 1rem 1.25rem 1.25rem; }
  .detail-card.flash { animation: flash 2.4s ease-out; }
  @keyframes flash { 0%, 40% { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-2); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .detail-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .detail-head h4 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin: 0; flex: 1 1 auto; min-width: 0; text-wrap: balance; }
  .chip { font-size: 0.75rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 0.1rem 0.55rem; white-space: nowrap; }
  .chip.trip { background: var(--c); border-color: var(--c); color: var(--on-c); }
  .icon-btn { background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 0.3rem 0.65rem; font-size: 1rem; line-height: 1.2; }
  .icon-btn:hover { border-color: var(--accent); }
  .detail-sum { color: var(--muted); margin: 0.3rem 0 0.9rem; font-size: 0.95rem; }
  .ev-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
  .ev { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 0.4rem 1rem; padding-top: 0.75rem; border-top: 1px solid var(--line); }
  .ev:first-child { border-top: 0; padding-top: 0; }
  .ev input, .ev textarea, .ev select {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box;
  }
  .ev input[type="time"] { font-variant-numeric: tabular-nums; padding: 0.35rem 0.4rem; width: 100%; }
  .ev .ev-title { width: 100%; font-weight: 600; font-size: 1.05rem; padding: 0.3rem 0.5rem; background: transparent; border-color: transparent; }
  .ev .ev-title:hover, .ev .ev-title:focus { border-color: var(--line); background: var(--bg); }
  .ev .place-row { display: flex; gap: 0.4rem; margin-top: 0.3rem; }
  .ev .place-row input { flex: 1 1 auto; min-width: 0; font-size: 0.9rem; padding: 0.3rem 0.5rem; }
  .ev .place-row button { flex: none; font-size: 0.8rem; padding: 0.3rem 0.6rem; }
  .ev .time-ro { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
  .ev h5 { font-size: 1.05rem; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .ev .pl { color: var(--muted); font-size: 0.85rem; margin: 0.25rem 0 0; overflow-wrap: anywhere; }
  .ev .pl.wait { color: var(--accent-2); }
  .ev .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.3rem; }
  .ev textarea { font-size: 0.95rem; padding: 0.45rem 0.6rem; width: 100%; resize: vertical; min-height: 3.2rem; margin-top: 0.4rem; }
  .ev .note-ro { margin: 0.3rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev .acts { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: 0.5rem; }
  .ev .acts button { font-size: 0.8rem; padding: 0.3rem 0.6rem; }
  .ev .acts select { font-size: 0.8rem; padding: 0.3rem 0.4rem; background: var(--surface); }
  .ev .acts a { color: var(--accent); font-weight: 600; font-size: 0.85rem; text-decoration: none; }
  .ev .acts a:hover { text-decoration: underline; }
  .ev .ev-main { min-width: 0; }
  @media (max-width: 560px) { .ev { grid-template-columns: minmax(0, 1fr); } }

  /* Karte */
  #map {
    height: min(34rem, 72vh); border-radius: 12px; border: 1px solid var(--line);
    background: var(--sea); font-family: var(--font-body);
  }
  #map.placing { cursor: crosshair; outline: 2px solid var(--accent-2); outline-offset: 2px; }
  #map.placing .leaflet-grab { cursor: crosshair; }
  .leaflet-container .leaflet-control-attribution { background: var(--surface); color: var(--muted); font-size: 0.7rem; }
  .leaflet-bar a { background: var(--surface); color: var(--fg); border-color: var(--line); }
  .leaflet-bar a:hover, .leaflet-bar a:focus { background: var(--bg); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--fg); }
  .leaflet-popup-content { margin: 12px 16px; font-size: 0.95rem; min-width: 12rem; }
  .pop h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.1rem; margin: 0 0 0.2rem; }
  .pop p { margin: 0 0 0.4rem; }
  .pop .pl { color: var(--muted); font-size: 0.8rem; }
  .leaflet-container .pop a.gm { color: var(--accent); font-weight: 600; font-size: 0.85rem; text-decoration: none; }
  .leaflet-container .pop a.gm:hover { text-decoration: underline; }
  .pop button { font-size: 0.8rem; padding: 0.3rem 0.6rem; }
  .pin-icon { background: none; border: 0; }
  .pin-icon svg { display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .pin-icon .lbl { position: absolute; left: 50%; top: -1.1rem; transform: translateX(-50%); font: 600 0.68rem/1 var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pin-icon.drop svg { animation: drop .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes drop { 0% { transform: translateY(-40px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .city-label { background: none; border: 0; white-space: nowrap; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; }
  .city-label b { color: var(--fg); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .city-label i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin-right: 4px; vertical-align: middle; }
  .park-label { background: none; border: 0; white-space: nowrap; font-size: 0.68rem; font-style: italic; color: var(--accent); font-weight: 600; transform: translate(-50%, -50%); }
  .state-label { background: none; border: 0; white-space: nowrap; font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--border); font-weight: 600; transform: translate(-50%, -50%); }
  /* Vorschläge: kleine Punkte, beim Hineinzoomen Namensschilder; Nadeln bleiben darüber */
  .map-legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1.1rem; color: var(--muted); font-size: 0.8rem; margin-bottom: 0.5rem; }
  .map-legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
  .map-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
  .map-legend .lg-pin { background: var(--pin); width: 11px; height: 11px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--pin); }
  .map-legend .lg-idea { background: var(--idea); border: 1.5px solid var(--surface); box-shadow: 0 0 0 1px var(--idea); }
  .map-legend .lg-idea.added { background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .idea-tag { background: none; border: 0; }
  .idea-tag span {
    position: absolute; left: 0; top: 0; transform: translate(-6px, -50%);
    display: inline-flex; align-items: center; gap: 0.3rem; max-width: 13rem;
    background: var(--surface); color: var(--fg); border: 1px solid color-mix(in srgb, var(--idea) 45%, var(--line));
    border-radius: 6px; padding: 2px 6px 2px 4px; font: 600 0.68rem/1.2 var(--font-body); white-space: nowrap; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
  }
  .idea-tag span::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--idea); }
  .idea-tag span b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .idea-tag.added span::before { background: var(--accent); }
  .idea-tag.added span { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .idea-tag.sel span { background: var(--idea); color: var(--surface); border-color: var(--idea); }
  .idea-tag.sel span::before { background: var(--surface); }
  .idea-card .meta { color: var(--muted); font-size: 0.85rem; margin: 0.2rem 0 0.6rem; }
  .idea-card .approx { color: var(--accent-2); font-size: 0.85rem; margin: 0 0 0.6rem; }
  .idea-card .desc { margin: 0 0 0.7rem; max-width: 42rem; }
  .idea-card .links { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; margin-bottom: 0.9rem; }
  .idea-card .links a { color: var(--accent); font-weight: 600; font-size: 0.9rem; text-decoration: none; overflow-wrap: anywhere; }
  .idea-card .links a:hover { text-decoration: underline; }
  .idea-card .already { color: var(--accent); font-weight: 600; font-size: 0.9rem; margin: 0 0 0.6rem; }
  .add-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-end; padding-top: 0.8rem; border-top: 1px solid var(--line); }
  .add-row label { display: grid; gap: 0.2rem; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .add-row select, .add-row input { font: inherit; font-size: 0.95rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0.4rem 0.5rem; text-transform: none; letter-spacing: 0; }
  .add-row .add-title { font-weight: 600; width: 100%; color: var(--fg); font-size: 0.95rem; }
  @media (prefers-reduced-motion: reduce) {
    .leaflet-zoom-anim .leaflet-zoom-animated, .detail, .bar { transition: none; }
    .detail-card.flash, .pin-icon.drop svg { animation: none; }
  }

  /* Grundlagen, die auf claude.ai die Plattform setzte */
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  /* PIN-Fenster */
  body.locked { overflow: hidden; }
  .gate {
    position: fixed; inset: 0; z-index: 5000; background: var(--bg); display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .gate-card { width: 100%; max-width: 22rem; display: grid; gap: 0.9rem; }
  .gate-title { font-size: clamp(2rem, 9vw, 2.6rem); margin: 0 0 0.2rem; }
  .gate-text { color: var(--muted); margin: 0; }
  .gate label { display: grid; gap: 0.25rem; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .gate input:not([type="checkbox"]) {
    font: inherit; font-size: 1.1rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.65rem 0.8rem; width: 100%; box-sizing: border-box; text-transform: none; letter-spacing: 0;
  }
  .gate .pin { font-size: 1.6rem; letter-spacing: 0.6em; text-align: center; font-variant-numeric: tabular-nums; }
  .gate .gate-check { display: flex; align-items: center; gap: 0.5rem; text-transform: none; letter-spacing: 0; font-size: 0.95rem; font-weight: 400; color: var(--fg); }
  .gate-msg { margin: 0; color: var(--pin); min-height: 1.4em; font-size: 0.95rem; }
  .who { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .who button { font-size: 0.8rem; padding: 0.25rem 0.6rem; }
</style>
</head>
<body class="locked">

<div class="gate" id="gate">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <img class="gate-photo" id="gate-photo" alt="" hidden>
    <h1 class="gate-title" data-trip-title></h1>
    <p class="gate-text" id="gate-text">Einen Moment …</p>
    <label for="gate-pin">PIN
      <input class="pin" id="gate-pin" name="gate-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required>
    </label>
    <label for="gate-pin2" id="gate-pin2-wrap" hidden>PIN wiederholen
      <input class="pin" id="gate-pin2" name="gate-pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    </label>
    <label for="gate-name">Dein Name
      <input id="gate-name" name="gate-name" maxlength="30" placeholder="Dein Name" required>
    </label>
    <label class="gate-check" for="gate-remember"><input type="checkbox" id="gate-remember" checked>Auf diesem Gerät angemeldet bleiben</label>
    <button type="submit" id="gate-btn">Öffnen</button>
    <p class="gate-msg" id="gate-msg" role="alert"></p>
    <button type="button" class="ghost" id="gate-new" hidden>Neuen Plan mit dieser PIN anlegen</button>
  </form>
</div>

<header class="hero" id="hero">
  <div class="wrap">
    <div class="eyebrow" id="trip-eyebrow"></div>
    <h1 data-trip-title></h1>
    <p class="lead" id="trip-lead"></p>
    <div class="count" id="count" aria-live="polite">
      <span class="count-num" id="count-num"></span>
      <span class="count-unit" id="count-unit"></span>
      <p class="count-msg" id="count-msg"></p>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="cal-block">
    <h2>Unser Zeitstrahl</h2>
    <form id="act-form" class="add-card" autocomplete="off">
      <div class="seg" role="radiogroup" aria-label="Dauer des Events">
        <button type="button" class="seg-btn on" id="mode-one" role="radio" aria-checked="true">Ein Tag</button>
        <button type="button" class="seg-btn" id="mode-multi" role="radio" aria-checked="false">Mehrere Tage</button>
      </div>
      <div class="fields">
        <label for="act-name" class="grow">Event
          <input id="act-name" name="act-name" required maxlength="100" placeholder="">
        </label>
        <label for="act-place" class="mid">Ort (optional)
          <input id="act-place" name="act-place" maxlength="80" placeholder="wenn nicht schon drinsteht">
        </label>
        <label for="act-day" class="day-sel"><span id="day-lbl">Tag</span>
          <select id="act-day" name="act-day"></select>
        </label>
        <label for="act-end" class="day-sel" id="end-wrap" hidden>bis
          <select id="act-end" name="act-end"></select>
        </label>
        <button type="submit" id="btn-add">Eintragen</button>
      </div>
      <p class="add-hint" id="add-hint">Tipp: Klick im Zeitstrahl auf einen Tag, dann ist er hier schon ausgewählt.</p>
    </form>
    <p id="status" role="status"></p>

    <ol class="vt" id="vt" aria-label="Zeitstrahl bis zur Reise und alle Reisetage"></ol>
    <div id="detail-park" hidden>
      <div class="detail" id="day-detail" aria-live="polite">
        <div class="detail-inner" id="detail-inner"></div>
      </div>
    </div>
    <div id="unsched" hidden>
      <h3>Noch ohne Tag</h3>
      <ul id="unsched-list"></ul>
    </div>
  </section>

  <section aria-label="Karte">
    <button type="button" class="to-map" id="to-map">
      <span class="tm-title">Zur Karte</span>
      <span class="tm-sub">Eure Nadeln und alle Vorschläge auf einen Blick</span>
      <span class="tm-go">Karte öffnen →</span>
    </button>
  </section>
</main>

<footer class="wrap who">Angemeldet als <strong id="who"></strong> <button type="button" class="ghost" id="logout">Abmelden</button></footer>

<div class="map-view" id="map-view" hidden role="dialog" aria-label="Karte">
  <div class="mv-bar">
    <button type="button" class="ghost" id="map-back">← Zurück zum Zeitstrahl</button>
    <span class="mv-title">Karte</span>
  </div>
  <div class="mv-body wrap" id="map-block">
    <div class="map-legend">
      <span><i class="lg-pin"></i>Eure Events</span>
      <span><i class="lg-idea"></i>Vorschläge, beim Hineinzoomen mit Namen</span>
      <span><i class="lg-idea added"></i>Vorschlag ist schon im Zeitstrahl</span>
    </div>
    <p class="map-status" id="map-status" role="status"></p>
    <div id="map" aria-label="Karte mit unseren Events und Vorschlägen"></div>
    <div class="detail" id="idea-detail" aria-live="polite">
      <div class="detail-inner" id="idea-inner"></div>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="mapdata.js"></script>
<script src="ideas.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const statusEl = $("status");
  const setStatus = (msg, warn) => {
    for (const e of [statusEl, document.getElementById("map-status")]) { if (e) { e.textContent = msg || ""; e.classList.toggle("warn", !!warn); } }
  };
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const motion = () => (matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");

  // --- Reise aus trip-config.js: Texte, Farben, Reisetage ---
  const TRIP = window.TRIP || {};
  const EX = TRIP.examples || {};
  document.title = TRIP.title || "Urlaubsplaner";
  document.querySelectorAll("[data-trip-title]").forEach((h) => {
    h.textContent = TRIP.title || "Urlaubsplaner";
    if (TRIP.titleAccent && h.textContent.endsWith(TRIP.titleAccent)) {
      h.textContent = h.textContent.slice(0, -TRIP.titleAccent.length);
      h.append(el("span", null, TRIP.titleAccent));
    }
  });
  $("trip-eyebrow").textContent = TRIP.eyebrow || "";
  $("trip-lead").textContent = TRIP.lead || "Unsere gemeinsame Seite für den Urlaub. Trage Events ein, sie landen sofort im Zeitstrahl und auf der Karte.";
  if (TRIP.palette) {
    const block = (vars) => Object.entries(vars || {}).map(([k, v]) => "--" + k + ":" + v + ";").join("");
    const st = document.createElement("style");
    st.textContent = ":root{" + block(TRIP.palette.light) + "}" +
      "@media (prefers-color-scheme: dark){:root:not([data-theme=light]){" + block(TRIP.palette.dark) + "color-scheme:dark}}" +
      ":root[data-theme=dark]{" + block(TRIP.palette.dark) + "color-scheme:dark}";
    document.head.append(st);
  }

  const isoOf = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parseIso = (s) => { const [y, m, dd] = String(s).split("-").map(Number); return new Date(y, m - 1, dd); };
  const DAYS = [];
  for (let d = parseIso(TRIP.start), end = parseIso(TRIP.end); d <= end; d.setDate(d.getDate() + 1)) {
    DAYS.push({
      iso: isoOf(d),
      wd: d.toLocaleDateString("de-DE", { weekday: "short" }).replace(".", ""),
      dt: d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }),
      we: d.getDay() === 0 || d.getDay() === 6,
    });
  }
  const dayIdx = (iso) => DAYS.findIndex((d) => d.iso === iso);
  const TAGS = TRIP.tags || {};
  const dayLabel = (iso) => { const d = DAYS.find((x) => x.iso === iso); return d ? d.wd + " " + d.dt : "Noch offen"; };
  // Vorschau: ?heute=JJJJ-MM-TT tut so, als wäre dieser Tag (zum Ansehen der Checkpoints)
  const fakeToday = new URLSearchParams(location.search).get("heute");
  const todayIso = /^\d{4}-\d{2}-\d{2}$/.test(fakeToday || "") ? fakeToday : isoOf(new Date());

  function fillDaySelect(sel, value, emptyLabel) {
    sel.textContent = "";
    const o = el("option", null, emptyLabel || "Noch offen"); o.value = ""; sel.append(o);
    DAYS.forEach((d) => { const opt = el("option", null, d.wd + " " + d.dt + (TAGS[d.iso] ? " · " + TAGS[d.iso] : "")); opt.value = d.iso; sel.append(opt); });
    sel.value = value || "";
  }
  fillDaySelect($("act-day"), "");
  fillDaySelect($("act-end"), "", "Tag wählen");

  // Eingabe: ein Tag oder mehrere Tage (Roadtrip)
  let multi = false;
  function setMode(m) {
    multi = m;
    $("mode-one").classList.toggle("on", !m); $("mode-one").setAttribute("aria-checked", String(!m));
    $("mode-multi").classList.toggle("on", m); $("mode-multi").setAttribute("aria-checked", String(m));
    $("end-wrap").hidden = !m;
    $("day-lbl").textContent = m ? "von" : "Tag";
    $("act-name").placeholder = "z. B. " + (m ? EX.multi || "Roadtrip" : EX.single || "Stadtrundgang");
    $("add-hint").textContent = m
      ? "Jeder Tag bekommt einen eigenen Eintrag, den du danach im Zeitstrahl einzeln bearbeiten kannst."
      : "Tipp: Klick im Zeitstrahl auf einen Tag, dann ist er hier schon ausgewählt.";
    if (!m) $("act-end").value = "";
  }
  setMode(false);
  $("mode-one").onclick = () => setMode(false);
  $("mode-multi").onclick = () => setMode(true);

  // --- Grundkarte aus eingebetteten Daten (mapdata.js), Ausschnitt aus trip-config.js ---
  const MAPCFG = TRIP.map || {};
  const REGION = MAPCFG.view;
  const MAXB = MAPCFG.maxBounds;
  const map = L.map("map", {
    preferCanvas: true, renderer: L.canvas({ padding: 0.6 }), minZoom: MAPCFG.minZoom || 5, maxZoom: 17,
    zoomSnap: 0, zoomDelta: 1, wheelPxPerZoomLevel: 15, wheelDebounceTime: 5, // stufenlos, mit Touchpad und Mausrad zügig
    inertia: true, inertiaDeceleration: 2200, easeLinearity: 0.25,
    maxBounds: MAXB, maxBoundsViscosity: 0.6,
    touchZoom: true, dragging: true, doubleClickZoom: true, bounceAtZoomLimits: false, // Zoomen mit zwei Fingern am Handy
  }).setView([(REGION[0][0] + REGION[1][0]) / 2, (REGION[0][1] + REGION[1][1]) / 2], 6); // genauer Ausschnitt beim ersten Öffnen
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution(MAPCFG.attribution || "Grenzen: geoBoundaries (CC BY 4.0) · Straßen und Parks: Natural Earth");

  const data = window.MAPDATA || { states: [], neighbors: [], roads: [], parks: [] };
  const HIGHLIGHT = new Set(MAPCFG.highlight || []);
  const baseLayer = L.layerGroup().addTo(map);
  const neighborPolys = (data.neighbors || []).map((r) => L.polygon(r, { interactive: false, weight: 1, fillOpacity: 1 }).addTo(baseLayer));
  const statePolys = data.states.map((s) => {
    const p = L.polygon(s.c, { interactive: false, weight: 1.2, fillOpacity: 1 });
    p._hi = HIGHLIGHT.has(s.n);
    return p.addTo(baseLayer);
  });
  const parkPolys = (data.parks || []).map((p) => L.polygon(p.c, { interactive: false, weight: 0.8, fillOpacity: 0.9 }).addTo(baseLayer));
  const minorRoads = L.layerGroup();
  const roadLines = data.roads.map((r) => {
    const l = L.polyline(r.c, { interactive: false, weight: r.t === "m" ? 2.2 : 1.1 });
    l._major = r.t === "m";
    return l.addTo(r.t === "m" ? baseLayer : minorRoads);
  });

  const stateLabels = L.layerGroup().addTo(map);
  (MAPCFG.regionLabels || [])
    .forEach(([n, lat, lng]) => L.marker([lat, lng], { interactive: false, keyboard: false,
      icon: L.divIcon({ className: "state-label", html: n, iconSize: null }) }).addTo(stateLabels));

  const cities = MAPCFG.cities || []; // [Name, lat, lng, groß?]
  const cityLayer = L.layerGroup().addTo(map);
  cities.forEach(([n, lat, lng, big]) => {
    const html = big ? "<b>" + n + "</b>" : "<i></i>" + n;
    L.marker([lat, lng], { interactive: false, keyboard: false,
      icon: L.divIcon({ className: "city-label", html, iconSize: null, iconAnchor: [3, 8] }) }).addTo(cityLayer);
  });

  // Parknamen: aus den Kartendaten plus Orte, die dort fehlen
  const parkNames = (data.parks || []).map((p) => [p.n.replace(/ NRA$| NM$| N PRES$| NM & PRES$/, ""), p.l[0], p.l[1]]);
  (MAPCFG.extraPlaces || []).forEach((x) => parkNames.push(x));
  const parkLayer = L.layerGroup();
  parkNames.forEach(([n, lat, lng]) => L.marker([lat, lng], { interactive: false, keyboard: false,
    icon: L.divIcon({ className: "park-label", html: n, iconSize: null }) }).addTo(parkLayer));

  function paintBase() {
    const land = css("--land"), landHi = css("--land-hi"), far = css("--land-far"), border = css("--border"), road = css("--road"), park = css("--park"), acc = css("--accent");
    neighborPolys.forEach((p) => p.setStyle({ color: border, fillColor: far }));
    statePolys.forEach((p) => p.setStyle({ color: border, fillColor: p._hi ? landHi : land }));
    parkPolys.forEach((p) => p.setStyle({ color: acc, opacity: 0.35, fillColor: park }));
    roadLines.forEach((l) => l.setStyle({ color: road, opacity: l._major ? 1 : 0.8 }));
  }
  function updateZoomLayers() {
    const z = map.getZoom();
    if (z >= 7) minorRoads.addTo(map); else minorRoads.remove();
    if (z >= 6.5) parkLayer.addTo(map); else parkLayer.remove();
    if (z <= 7.5) stateLabels.addTo(map); else stateLabels.remove();
  }
  paintBase();
  updateZoomLayers();
  map.on("zoomend", updateZoomLayers);
  try {
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { paintBase(); render(true); });
    new MutationObserver(() => { paintBase(); render(true); })
      .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  } catch (e) {}

  // --- Zustand ---
  let db = null, canWrite = true;
  let acts = [];              // Events: {id, name, place, day, time, note, lat, lng, tripId, by, at}
  let trips = [];             // Roadtrips: {id, name, place, start, end, color, by, at}
  const markers = new Map();  // id -> marker
  const names = {};           // user id -> name
  const locating = new Set(); // ids, für die gerade die Nadel gesucht wird
  let placing = null;         // id, für die auf einen Klick in die Karte gewartet wird
  let justPinned = null;      // id, deren Nadel gerade gesetzt wurde (fällt auf die Karte)
  let openDay = null;         // geöffneter Tag
  let flashDetail = false;    // Detailansicht kurz hervorheben
  let detailDirty = false;    // Neuzeichnen wartet, solange jemand in der Detailansicht tippt
  const hasPos = (a) => typeof a.lat === "number" && typeof a.lng === "number";
  const col = () => db.collection("orte");
  const tripCol = () => db.collection("reisen");
  const tripOf = (a) => (a.tripId ? trips.find((t) => t.id === a.tripId) : null);
  const tripVar = (t) => "var(--c" + ((Number(t.color) || 0) % 6 + 1) + ")";
  const tripLen = (t) => dayIdx(t.end) - dayIdx(t.start) + 1;
  const byTime = (x, y) => (x.time || "99:99").localeCompare(y.time || "99:99") || (x.at || 0) - (y.at || 0);
  let me = "";                // Name der Person an diesem Gerät
  const myId = async () => me || null;
  const gmUrl = (a) => "https://www.google.com/maps/search/?api=1&query=" + a.lat.toFixed(6) + "," + a.lng.toFixed(6);

  // --- Vorschläge aus den Ideenlisten: Punkte, ab LABEL_ZOOM Namensschilder; Nadeln liegen darüber ---
  const IDEAS = window.IDEAS || [];
  const LABEL_ZOOM = 11;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const hasIdeaPos = (i) => typeof i.la === "number" && typeof i.ln === "number";
  map.createPane("ideas").style.zIndex = 450;
  const ideaRenderer = L.canvas({ pane: "ideas", padding: 0.3 });
  const ideaDots = L.layerGroup();
  const ideaById = new Map(IDEAS.map((i) => [i.id, i]));
  const dotOf = new Map(), tagOf = new Map(), ideaState = new Map();
  let selIdea = null, ideaDirty = false;
  let addedIdeas = new Map(); // ideaId -> Tage, an denen der Vorschlag im Zeitstrahl steht

  const tagIcon = (i) => L.divIcon({
    className: "idea-tag" + (addedIdeas.has(i.id) ? " added" : "") + (selIdea === i.id ? " sel" : ""),
    html: "<span><b>" + esc(i.t) + "</b></span>", iconSize: [0, 0],
  });
  IDEAS.filter(hasIdeaPos).forEach((i) => {
    const d = L.circleMarker([i.la, i.ln], { renderer: ideaRenderer, pane: "ideas", radius: 4, weight: 1.5, fillOpacity: 1 });
    d.bindTooltip(i.t, { direction: "top", offset: [0, -4] });
    d.on("click", () => showIdea(i.id));
    d.addTo(ideaDots); dotOf.set(i.id, d);
    const t = L.marker([i.la, i.ln], { pane: "ideas", icon: tagIcon(i), keyboard: false, title: i.t });
    t.on("click", () => showIdea(i.id));
    tagOf.set(i.id, t);
  });
  // Namensschilder nur im sichtbaren Ausschnitt, damit Verschieben und Zoomen flüssig bleiben
  if (!IDEAS.length) document.querySelectorAll(".map-legend span").forEach((sp, k) => { if (k > 0) sp.hidden = true; });
  function updateIdeaLayers() {
    if (map.getZoom() >= LABEL_ZOOM) {
      ideaDots.remove();
      const b = map.getBounds().pad(0.4);
      tagOf.forEach((t) => {
        const inView = b.contains(t.getLatLng());
        if (inView && !map.hasLayer(t)) t.addTo(map);
        else if (!inView && map.hasLayer(t)) t.remove();
      });
    } else {
      tagOf.forEach((t) => { if (map.hasLayer(t)) t.remove(); });
      ideaDots.addTo(map);
    }
  }
  updateIdeaLayers();
  map.on("moveend", updateIdeaLayers);

  function refreshIdeas(restyle) {
    addedIdeas = new Map();
    acts.forEach((a) => { if (a.ideaId) addedIdeas.set(a.ideaId, (addedIdeas.get(a.ideaId) || []).concat(a.day || "")); });
    const ideaC = css("--idea"), accC = css("--accent"), surfC = css("--surface");
    IDEAS.filter(hasIdeaPos).forEach((i) => {
      const st = (addedIdeas.has(i.id) ? 1 : 0) + (selIdea === i.id ? 2 : 0);
      if (!restyle && ideaState.get(i.id) === st) return;
      ideaState.set(i.id, st);
      dotOf.get(i.id).setStyle({ color: surfC, fillColor: st & 1 ? accC : ideaC, radius: st & 2 ? 7 : 4 });
      if (st & 2) dotOf.get(i.id).bringToFront();
      tagOf.get(i.id).setIcon(tagIcon(i));
      tagOf.get(i.id).setZIndexOffset(st & 2 ? 1000 : 0);
    });
  }

  function showIdea(id) {
    selIdea = id;
    refreshIdeas();
    renderIdea(true);
    setTimeout(() => $("idea-detail").scrollIntoView({ behavior: motion(), block: "nearest" }), 480);
  }

  function renderIdea(force) {
    const box = $("idea-detail"), inner = $("idea-inner");
    const i = selIdea && ideaById.get(selIdea);
    if (!i) { box.classList.remove("open"); return; }
    const f = document.activeElement;
    if (!force && f && box.contains(f) && /^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName)) { ideaDirty = true; return; }
    ideaDirty = false;
    const card = el("div", "detail-card idea-card");
    const head = el("div", "detail-head");
    head.append(el("h4", null, i.t));
    const close = el("button", "icon-btn", "✕"); close.type = "button"; close.setAttribute("aria-label", "Vorschlag schließen");
    close.onclick = () => { selIdea = null; refreshIdeas(); renderIdea(); };
    head.append(close);
    card.append(head);
    card.append(el("p", "meta", [i.a, "Ideenliste " + i.s + ", Nr. " + i.n].filter(Boolean).join(" · ")));
    if (!hasIdeaPos(i)) card.append(el("p", "approx", "Diese Idee hat keinen festen Ort."));
    else if (i.ap) card.append(el("p", "approx", "Die Lage ist ungefähr: Der Punkt zeigt die Gegend, nicht den genauen Ort."));
    if (i.d) card.append(el("p", "desc", i.d));
    const links = el("div", "links");
    if (i.u) { const a = el("a", null, "Website öffnen ↗"); a.href = i.u; a.target = "_blank"; a.rel = "noopener"; links.append(a); }
    if (hasIdeaPos(i)) {
      const a = el("a", null, "In Google Maps öffnen ↗");
      a.href = i.ap ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(i.t + " " + (i.a || ""))
                    : "https://www.google.com/maps/search/?api=1&query=" + i.la.toFixed(5) + "," + i.ln.toFixed(5);
      a.target = "_blank"; a.rel = "noopener"; links.append(a);
    }
    if (links.childNodes.length) card.append(links);
    const days = addedIdeas.get(i.id);
    if (days) {
      const p = el("p", "already", "Schon im Zeitstrahl: " + days.map(dayLabel).join(", ") + " ");
      const go = el("button", "ghost", "Im Zeitstrahl ansehen"); go.type = "button";
      go.style.cssText = "font-size:0.8rem;padding:0.25rem 0.55rem;margin-left:0.3rem";
      go.onclick = () => { if (days[0]) { closeMap(); setTimeout(() => openDayAt(days[0], true), 80); } };
      p.append(go); card.append(p);
    }
    if (canWrite) {
      const row = el("div", "add-row");
      row.append(el("span", "add-title", days ? "Noch an einem Tag eintragen" : "Zum Zeitstrahl hinzufügen"));
      const dl = el("label", null, "Tag"); const sel = document.createElement("select");
      sel.id = "idea-day"; fillDaySelect(sel, openDay || "", "Tag wählen"); dl.append(sel);
      const tl = el("label", null, "Uhrzeit (optional)"); const tm = document.createElement("input");
      tm.type = "time"; tm.id = "idea-time"; tl.append(tm);
      const btn = el("button", null, "Hinzufügen"); btn.type = "button";
      const msg = el("p", "detail-sum"); msg.style.cssText = "width:100%;margin:0";
      btn.onclick = () => addIdea(i, sel.value, tm.value, btn, msg);
      row.append(dl, tl, btn, msg);
      card.append(row);
    }
    inner.textContent = "";
    inner.append(card);
    requestAnimationFrame(() => box.classList.add("open"));
  }
  $("idea-detail").addEventListener("focusout", () => setTimeout(() => {
    const f = document.activeElement;
    if (ideaDirty && !(f && $("idea-detail").contains(f) && /^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName))) renderIdea();
  }, 0));

  async function addIdea(i, day, time, btn, msg) {
    if (!day) { msg.textContent = "Wähle zuerst einen Tag."; return; }
    btn.disabled = true;
    const doc = {
      name: i.t, place: i.a || "", day, time: time || "", note: [i.d, i.u].filter(Boolean).join("\n"),
      lat: hasIdeaPos(i) ? i.la : null, lng: hasIdeaPos(i) ? i.ln : null, ideaId: i.id, at: Date.now(),
    };
    const by = await myId(); if (by) doc.by = by;
    if (db) {
      try { await col().doc().set(doc); }
      catch (e) { btn.disabled = false; failWrite(e); msg.textContent = "Hinzufügen hat nicht geklappt. Versuch es gleich noch mal."; return; }
    } else {
      acts.push({ id: "local-" + Date.now(), ...doc });
    }
    justPinned = null;
    setStatus("„" + i.t + "“ steht jetzt im Zeitstrahl am " + dayLabel(day) + ".");
    render();
    renderIdea(true);
  }


  function pinIcon(a) {
    const t = tripOf(a);
    const c = t ? css("--c" + ((Number(t.color) || 0) % 6 + 1)) : css("--pin");
    const d = DAYS.find((x) => x.iso === a.day);
    const svg =
      (d ? '<span class="lbl">' + d.dt + "</span>" : "") +
      '<svg width="26" height="40" viewBox="0 0 26 40" aria-hidden="true">' +
      '<line x1="13" y1="14" x2="13" y2="39" stroke="#8a8f93" stroke-width="2" stroke-linecap="round"/>' +
      '<circle cx="13" cy="10" r="9" fill="' + c + '" stroke="rgba(0,0,0,.25)" stroke-width="1"/>' +
      '<circle cx="10" cy="7" r="3" fill="#fff" fill-opacity=".55"/></svg>';
    return L.divIcon({ className: "pin-icon", html: svg, iconSize: [26, 40], iconAnchor: [13, 39], popupAnchor: [0, -34] });
  }

  async function updateAct(id, fields, okMsg) {
    if (!db) { const a = acts.find((x) => x.id === id); if (a) Object.assign(a, fields); render(); if (okMsg) setStatus(okMsg); return true; }
    try { await col().doc(id).update(fields); if (okMsg) setStatus(okMsg); return true; }
    catch (e) { setStatus("Die Änderung wurde nicht gespeichert. Versuch es gleich noch mal.", true); return false; }
  }

  async function deleteAct(a) {
    if (!db) { acts = acts.filter((x) => x.id !== a.id); render(); return true; }
    try { await col().doc(a.id).delete(); setStatus("„" + a.name + "“ gelöscht."); return true; }
    catch (e) { setStatus("Löschen hat nicht geklappt. Versuch es gleich noch mal.", true); return false; }
  }

  async function deleteTrip(t) {
    const days = acts.filter((a) => a.tripId === t.id);
    if (!db) { acts = acts.filter((a) => a.tripId !== t.id); trips = trips.filter((x) => x.id !== t.id); render(); return; }
    try {
      for (const a of days) await col().doc(a.id).delete();
      await tripCol().doc(t.id).delete();
      setStatus("Roadtrip „" + t.name + "“ gelöscht.");
    } catch (e) { setStatus("Löschen hat nicht ganz geklappt. Versuch es gleich noch mal.", true); }
  }

  function confirmInline(row, trigger, question, yesLabel, onYes) {
    trigger.remove();
    const q = el("span", null, question);
    const yes = el("button", null, yesLabel); yes.type = "button";
    const no = el("button", "ghost", "Nein"); no.type = "button";
    no.onclick = () => { q.remove(); yes.remove(); no.remove(); row.append(trigger); };
    yes.onclick = async () => { yes.disabled = true; await onYes(); };
    row.append(q, yes, no);
  }

  // --- Karten-Popup ---
  function popupFor(a) {
    const box = el("div", "pop");
    box.append(el("h3", null, a.name));
    const t = tripOf(a);
    if (t) box.append(el("p", "pl", t.name + " · Tag " + (dayIdx(a.day) - dayIdx(t.start) + 1) + " von " + tripLen(t)));
    if (a.place) box.append(el("p", "pl", a.place));
    box.append(el("p", "pl", dayLabel(a.day) + (a.time ? " · " + a.time : "")));
    if (a.note) box.append(el("p", null, a.note));
    if (hasPos(a)) {
      const gm = el("a", "gm", "In Google Maps öffnen ↗");
      gm.href = gmUrl(a); gm.target = "_blank"; gm.rel = "noopener";
      const p = el("p"); p.append(gm); box.append(p);
    }
    if (a.day) {
      const open = el("button", "ghost", "Tag im Zeitstrahl öffnen"); open.type = "button";
      open.onclick = () => { map.closePopup(); closeMap(); setTimeout(() => openDayAt(a.day, true), 80); };
      box.append(open);
    }
    return box;
  }

  // --- Blickführung ---
  function showOnMap(a) {
    openMap();
    map.flyTo([a.lat, a.lng], Math.max(map.getZoom(), 12), { duration: 0.9 });
    const m = markers.get(a.id); if (m) setTimeout(() => m.openPopup(), 1000);
  }
  function fitTrip(tripId) {
    const pts = acts.filter((a) => a.tripId === tripId && hasPos(a)).map((a) => [a.lat, a.lng]);
    if (!pts.length) return;
    openMap();
    if (pts.length === 1) map.flyTo(pts[0], 10, { duration: 0.9 });
    else map.flyToBounds(pts, { padding: [50, 50], duration: 0.9, maxZoom: 10 });
  }

  // --- Tag öffnen: Detailansicht klappt in der Karte des Tages auf ---
  const dayDetailEl = document.getElementById("day-detail");
  function openDayAt(iso, scroll) {
    openDay = iso;
    if (!multi || !$("act-end").value) $("act-day").value = iso; // die eine Eingabe übernimmt den geöffneten Tag
    render();
    const r = document.querySelector('.vt-row[data-day="' + iso + '"]');
    if (scroll && r) setTimeout(() => r.scrollIntoView({ behavior: motion(), block: "start" }), 60);
  }
  function toggleDay(iso) {
    if (openDay === iso) { openDay = null; render(); return; }
    openDayAt(iso, true);
  }
  function editingDetail() {
    const f = document.activeElement;
    return !!f && dayDetailEl.contains(f) && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName);
  }

  function evFor(a) {
    const li = el("li", "ev");
    const t = tripOf(a);
    const left = el("div");
    if (canWrite) {
      const ti = document.createElement("input");
      ti.type = "time"; ti.value = a.time || ""; ti.setAttribute("aria-label", "Uhrzeit für " + a.name);
      ti.onchange = () => updateAct(a.id, { time: ti.value }, "Uhrzeit gespeichert.");
      left.append(ti);
    } else {
      left.append(el("span", "time-ro", a.time || "–"));
    }
    const main = el("div", "ev-main");
    if (t) {
      const chips = el("div", "chips");
      const chip = el("span", "chip trip", t.name + " · Tag " + (dayIdx(a.day) - dayIdx(t.start) + 1) + " von " + tripLen(t));
      chip.style.setProperty("--c", tripVar(t));
      chips.append(chip); main.append(chips);
    }
    if (canWrite) {
      const title = document.createElement("input");
      title.className = "ev-title"; title.value = a.name; title.maxLength = 100;
      title.setAttribute("aria-label", "Titel");
      title.onchange = () => { const v = title.value.trim(); if (v && v !== a.name) updateAct(a.id, { name: v }, "Titel gespeichert."); };
      main.append(title);
      const pr = el("div", "place-row");
      const place = document.createElement("input");
      place.value = a.place || ""; place.maxLength = 80; place.placeholder = "Ort, z. B. " + (EX.place || "Stadtzentrum");
      place.setAttribute("aria-label", "Ort von " + a.name);
      place.onchange = () => { const v = place.value.trim(); if (v !== (a.place || "")) updateAct(a.id, { place: v }, "Ort gespeichert."); };
      const find = el("button", "ghost", locating.has(a.id) ? "Sucht …" : "Nadel suchen"); find.type = "button";
      find.disabled = locating.has(a.id);
      find.onclick = async () => {
        const v = place.value.trim();
        if (v !== (a.place || "")) await updateAct(a.id, { place: v });
        locate(a.id, title.value.trim() || a.name, v, true);
      };
      pr.append(place, find);
      main.append(pr);
    } else {
      main.append(el("h5", null, a.name));
      if (a.place) main.append(el("p", "pl", a.place));
    }
    if (locating.has(a.id)) main.append(el("p", "pl wait", "Nadel wird gesucht …"));
    else if (!hasPos(a)) main.append(el("p", "pl", "Noch ohne Nadel"));
    if (a.by && names[a.by]) main.append(el("p", "pl", "Eingetragen von " + names[a.by]));
    if (canWrite) {
      const ta = document.createElement("textarea");

      main.append(ta);
    } else if (a.note) {
      main.append(el("p", "note-ro", a.note));
