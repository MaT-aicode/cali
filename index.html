    const row = el("div", "acts");
    if (hasPos(a)) {
      const show = el("button", "ghost", "Auf Karte zeigen"); show.type = "button"; show.onclick = () => showOnMap(a);
      const gm = el("a", null, "Google Maps ↗"); gm.href = gmUrl(a); gm.target = "_blank"; gm.rel = "noopener";
      row.append(show, gm);
    } else if (canWrite && !locating.has(a.id)) {
      const set = el("button", "ghost", "Nadel per Klick setzen"); set.type = "button"; set.onclick = () => startPlacing(a.id);
      row.append(set);
    }
    if (canWrite) {
      if (!t) {
        const sel = document.createElement("select");
        sel.setAttribute("aria-label", "Auf anderen Tag verschieben");
        fillDaySelect(sel, a.day);
        sel.onchange = () => updateAct(a.id, { day: sel.value }, "„" + a.name + "“ liegt jetzt auf " + dayLabel(sel.value) + ".");
        row.append(sel);
      }
      const del = el("button", "ghost", t ? "Diesen Tag löschen" : "Löschen"); del.type = "button";
      del.onclick = () => confirmInline(row, del, "Wirklich löschen?", "Ja, löschen", () => deleteAct(a));
      row.append(del);
      if (t) {
        const delT = el("button", "ghost", "Ganzen Roadtrip löschen"); delT.type = "button";
        delT.onclick = () => confirmInline(row, delT, "Alle " + tripLen(t) + " Tage löschen?", "Ja, alle löschen", () => deleteTrip(t));
        row.append(delT);
      }
    }
    main.append(row);
    li.append(left, main);
    return li;
  }

  function renderDetail() {
    const box = dayDetailEl, inner = $("detail-inner");
    if (!openDay) { box.classList.remove("open"); return; } // Inhalt bleibt fürs Zuklappen stehen
    if (editingDetail()) { detailDirty = true; return; }
    detailDirty = false;
    const idx = dayIdx(openDay);
    const list = acts.filter((a) => a.day === openDay).sort(byTime);
    const card = el("div", "detail-card" + (flashDetail ? " flash" : ""));
    flashDetail = false;

    const head = el("div", "detail-head");
    const prev = el("button", "icon-btn", "‹"); prev.type = "button"; prev.setAttribute("aria-label", "Vorheriger Tag");
    prev.disabled = idx === 0; prev.onclick = () => openDayAt(DAYS[idx - 1].iso);
    const next = el("button", "icon-btn", "›"); next.type = "button"; next.setAttribute("aria-label", "Nächster Tag");
    next.disabled = idx === DAYS.length - 1; next.onclick = () => openDayAt(DAYS[idx + 1].iso);
    const close = el("button", "icon-btn", "✕"); close.type = "button"; close.setAttribute("aria-label", "Tag schließen");
    close.onclick = () => { openDay = null; render(); };
    const title = el("h4", null, new Date(openDay + "T12:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
    head.append(prev, next, title);
    if (TAGS[openDay]) head.append(el("span", "chip", TAGS[openDay]));
    head.append(close);
    card.append(head);

    const sum = list.length ? (list.length === 1 ? "1 Event" : list.length + " Events") : "Noch nichts geplant. Trag oben ein Event ein, der Tag ist schon ausgewählt.";
    card.append(el("p", "detail-sum", sum + " · Tag " + (idx + 1) + " von " + DAYS.length));
    if (list.length) {
      const ul = el("ul", "ev-list");
      list.forEach((a) => ul.append(evFor(a)));
      card.append(ul);
    }
    inner.textContent = "";
    inner.append(card);
    requestAnimationFrame(() => box.classList.add("open"));
  }
  dayDetailEl.addEventListener("focusout", () => setTimeout(() => { if (detailDirty && !editingDetail()) render(); }, 0));

  // --- Zeitstrahl von oben nach unten: Heute, Countdown-Checkpoints, dann alle Reisetage ---
  const CD = TRIP.countdown || {};
  const CPS = (CD.checkpoints || []).slice().sort((x, y) => x.date.localeCompare(y.date));
  const START = DAYS.length ? DAYS[0].iso : "", END = DAYS.length ? DAYS[DAYS.length - 1].iso : "";
  const daysBetween = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 864e5);
  const railDate = (iso) => {
    const d = parseIso(iso);
    return [d.toLocaleDateString("de-DE", { weekday: "short" }).replace(".", ""), d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })];
  };
  const unlocked = (c) => c.date <= todayIso;
  const photoUrl = (p) => (p ? encodeURI(p) : "");

  // Spruch und Zahl für den Kopfbereich
  function countdownState() {
    const t = todayIso;
    if (t < START) {
      const n = daysBetween(t, START);
      const cur = CPS.filter((c) => c.date <= t && (!c.until || t <= c.until)).pop();
      return { num: String(n), unit: n === 1 ? CD.unitOne || "Tag bis zur Reise" : CD.unit || "Tage bis zur Reise", msg: cur ? cur.text : CD.before || "" };
    }
    if (t <= END) {
      const cur = CPS.filter((c) => c.date === t).pop();
      return { num: String(dayIdx(t) + 1), unit: "Reisetag von " + DAYS.length, msg: cur ? cur.text : CD.during || "" };
    }
    return { num: "", unit: "", msg: CD.after || "Schön war's." };
  }
  function renderCountdown() {
    const s = countdownState();
    $("count-num").textContent = s.num;
    $("count-unit").textContent = s.unit;
    $("count-msg").textContent = s.msg;
    $("count").hidden = !s.num && !s.msg;
  }

  function cpCard(c, current) {
    const open = unlocked(c);
    const box = el("div", "vt-cp" + (open ? "" : " locked") + (c.photo ? "" : " no-photo"));
    if (c.photo) {
      const img = document.createElement("img");
      img.src = photoUrl(c.photo); img.loading = "lazy"; img.alt = open ? c.alt || "Foto von uns" : "";
      box.append(img);
    }
    const [, dt] = railDate(c.date);
    box.append(el("p", null, open ? c.text : "Wird am " + dt + " freigeschaltet."));
    if (current) box.setAttribute("aria-current", "date");
    return box;
  }

  function renderTimeline() {
    const vt = $("vt"); vt.textContent = "";
    // Roadtrips als Streifen neben der Linie, jeder in seiner eigenen Spur
    const lanes = [], laneOf = new Map();
    trips.slice().sort((a, b) => String(a.start).localeCompare(String(b.start))).forEach((t) => {
      const s = dayIdx(t.start), e = dayIdx(t.end); if (s < 0 || e < s) return;
      let l = lanes.findIndex((last) => last < s); if (l === -1) { l = lanes.length; lanes.push(-1); }
      lanes[l] = e; laneOf.set(t.id, l);
    });
    const L = lanes.length;
    vt.style.setProperty("--lanes", L);
    vt.style.setProperty("--lanes-w", L ? L * 7 + (L - 1) * 3 + "px" : "0px");

    const row = (cls, iso, wd, dt) => {
      const r = el("li", "vt-row " + cls); if (iso) r.dataset.day = iso;
      const d = el("div", "vt-date"); if (wd) d.append(el("span", "wd", wd)); if (dt) d.append(el("span", "dt", dt));
      const rail = el("div", "vt-rail"); rail.append(el("span", "vt-dot"));
      const ln = el("div", "vt-lanes"); for (let l = 0; l < L; l++) ln.append(el("div", "vt-lane none"));
      const body = el("div", "vt-body");
      r.append(d, rail, ln, body); vt.append(r);
      return { r, ln, body };
    };

    // Vor der Reise: Heute und die Checkpoints in zeitlicher Reihenfolge
    if (todayIso < START) {
      const cur = CPS.filter((c) => c.date <= todayIso).pop();
      const pre = CPS.filter((c) => c.date < START).map((c) => ({ kind: "cp", date: c.date, c }));
      if (!pre.some((p) => p.date === todayIso)) pre.push({ kind: "today", date: todayIso });
      pre.sort((a, b) => a.date.localeCompare(b.date) || (a.kind === "today" ? -1 : 1));
      pre.forEach((p) => {
        const [wd, dt] = railDate(p.date);
        if (p.kind === "today") {
          const { body } = row("today", null, "Heute", dt);
          const n = daysBetween(todayIso, START);
          const box = el("div", "vt-now");
          box.append(el("b", null, "noch " + n + (n === 1 ? " Tag" : " Tage")));
          const msg = cur ? cur.text : CD.before;
          if (msg) box.append(el("p", null, msg));
          body.append(box);
        } else {
          const isCur = cur && cur.date === p.date;
          const { body } = row((p.date < todayIso ? "done" : "") + (p.date === todayIso ? " today" : "") + (isCur ? " current" : ""), null, wd, dt);
          body.append(cpCard(p.c, isCur));
        }
      });
    }

    // Die Reise
    const sep = row("vt-sep" + (todayIso >= START ? " done" : ""), null, "", "");
    sep.body.append(el("h3", null, CD.tripHeading || "Die Reise"), el("p", null, DAYS.length + " Tage · " + dayLabel(START) + " bis " + dayLabel(END)));

    DAYS.forEach((d, i) => {
      const list = acts.filter((a) => a.day === d.iso).sort(byTime);
      const isOpen = d.iso === openDay;
      const cls = (list.length ? "has" : "") + (d.iso < todayIso ? " done" : "") + (d.iso === todayIso ? " today" : "") + (isOpen ? " open" : "");
      const { ln, body } = row(cls, d.iso, d.wd, d.dt);
      [...ln.children].forEach((cell, l) => {
        const t = trips.find((x) => laneOf.get(x.id) === l && dayIdx(x.start) <= i && i <= dayIdx(x.end));
        if (!t) return;
        cell.className = "vt-lane" + (dayIdx(t.start) === i ? " s" : "") + (dayIdx(t.end) === i ? " e" : "");
        cell.style.setProperty("--c", tripVar(t)); cell.title = t.name;
      });

      const card = el("div", "vt-card" + (isOpen ? " open" : ""));
      const head = el("button", "vt-head"); head.type = "button";
      head.setAttribute("aria-expanded", isOpen ? "true" : "false");
      head.append(el("span", "vt-title", "Tag " + (i + 1)));
      if (TAGS[d.iso]) head.append(el("span", "chip", TAGS[d.iso]));
      head.append(el("span", "vt-more", isOpen ? "Schließen" : list.length ? "Öffnen" : "Planen"));
      head.onclick = () => toggleDay(d.iso);
      card.append(head);
      const cp = CPS.find((c) => c.date === d.iso && unlocked(c));
      if (cp) card.append(cpCard(cp, d.iso === todayIso));
      if (isOpen) {
        card.append(dayDetailEl);
      } else if (list.length) {
        const ul = el("ul", "vt-evs");
        list.forEach((a) => {
          const li = document.createElement("li");
          const b = el("button", "vt-ev"); b.type = "button";
          b.append(el("span", "t", a.time || ""));
          const nm = el("span", "nm");
          const t = tripOf(a);
          if (t) { const sw = el("span", "sw"); sw.style.setProperty("--c", tripVar(t)); nm.append(sw); }
          nm.append(document.createTextNode(a.name));
          b.append(nm, el("span", "pl", locating.has(a.id) ? "Nadel wird gesucht …" : a.place || (hasPos(a) ? "Auf der Karte" : "Noch ohne Ort")));
          b.onclick = () => toggleDay(d.iso);
          li.append(b); ul.append(li);
        });
        card.append(ul);
      } else {
        card.append(el("p", "vt-empty", "Noch frei"));
      }
      body.append(card);
    });
    if (!openDay) $("detail-park").append(dayDetailEl);
  }

  // --- Karte als eigene Ansicht; Zurück (Button, Browser, Escape) führt zum Zeitstrahl ---
  let mapOpen = false, mapFitted = false;
  function openMap() {
    if (mapOpen) return;
    mapOpen = true;
    $("map-view").hidden = false;
    document.body.classList.add("map-open");
    try { history.pushState({ karte: 1 }, ""); } catch (e) {}
    map.invalidateSize();
    if (!mapFitted) { map.fitBounds(REGION); mapFitted = true; }
    $("map-back").focus({ preventScroll: true });
  }
  function closeMapView() {
    if (!mapOpen) return;
    mapOpen = false;
    $("map-view").hidden = true;
    document.body.classList.remove("map-open");
    if (placing) { placing = null; $("map").classList.remove("placing"); }
  }
  function closeMap() {
    if (history.state && history.state.karte) history.back(); else closeMapView();
  }
  window.addEventListener("popstate", () => closeMapView());
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && mapOpen) closeMap(); });
  $("to-map").onclick = openMap;
  $("map-back").onclick = closeMap;

  // Fotos aus trip-config.js
  if (TRIP.hero) { $("hero").style.setProperty("--hero-img", "url(\"" + photoUrl(TRIP.hero) + "\")"); $("hero").classList.add("has-photo"); }
  else if (TRIP.heroGradient) $("hero").style.setProperty("--hero-img", TRIP.heroGradient); // Farbverlauf statt Foto
  if (TRIP.heroAccent) $("hero").style.setProperty("--hero-accent", TRIP.heroAccent);
  if (TRIP.heroPosition) $("hero").style.setProperty("--hero-pos", TRIP.heroPosition);
  if (TRIP.mapPhoto) $("to-map").style.setProperty("--map-img", "url(\"" + photoUrl(TRIP.mapPhoto) + "\")");
  if (TRIP.gatePhoto) { const g = $("gate-photo"); g.src = photoUrl(TRIP.gatePhoto); g.hidden = false; }
  renderCountdown();

  function itemFor(a) {
    const li = document.createElement("li");
    const b = el("button", "item"); b.type = "button";
    b.append(el("span", "nm", a.name), el("span", "pl", hasPos(a) ? a.place || "Auf der Karte" : "Ohne Nadel"));
    b.onclick = () => (hasPos(a) ? showOnMap(a) : canWrite && startPlacing(a.id));
    li.append(b);
    return li;
  }

  function render(restyle) {
    if (editingDetail()) detailDirty = true;
    else { renderTimeline(); renderDetail(); }

    const open = acts.filter((a) => dayIdx(a.day) < 0);
    $("unsched").hidden = !open.length;
    const ul = $("unsched-list"); ul.textContent = "";
    open.forEach((a) => ul.append(itemFor(a)));

    const seen = new Set();
    acts.filter(hasPos).forEach((a) => {
      seen.add(a.id);
      let m = markers.get(a.id);
      const key = a.day + "|" + (a.tripId || "");
      if (!m) {
        m = L.marker([a.lat, a.lng], { icon: pinIcon(a), draggable: canWrite, title: a.name, riseOnHover: true }).addTo(map);
        m._actId = a.id;
        if (a.id === justPinned) { const ic = m.getElement(); if (ic) ic.classList.add("drop"); justPinned = null; }
        m.on("dragend", async () => {
          const ll = m.getLatLng();
          const cur = acts.find((x) => x.id === m._actId);
          const ok = await updateAct(m._actId, { lat: ll.lat, lng: ll.lng }, "Nadel für „" + (cur ? cur.name : "Event") + "“ verschoben.");
          if (!ok && cur) m.setLatLng([cur.lat, cur.lng]);
        });
        markers.set(a.id, m);
      } else {
        m.setLatLng([a.lat, a.lng]);
        if (restyle || m._key !== key) m.setIcon(pinIcon(a));
      }
      m._key = key;
      m.unbindPopup().bindPopup(() => popupFor(a));
    });
    for (const [id, m] of markers) if (!seen.has(id)) { m.remove(); markers.delete(id); }

    refreshIdeas(restyle);
    renderIdea();
  }


  // --- Nadel per Klick ---
  function startPlacing(id) {
    const a = acts.find((x) => x.id === id); if (!a) return;
    placing = id;
    $("map").classList.add("placing");
    openMap();
    setStatus("Tippe in die Karte, wo „" + a.name + "“ hin soll.");
  }
  map.on("click", async (ev) => {
    if (!placing) return;
    const id = placing; placing = null; $("map").classList.remove("placing");
    justPinned = id;
    await updateAct(id, { lat: ev.latlng.lat, lng: ev.latlng.lng }, "Nadel gesetzt.");
  });

  // --- Orte finden: erst eure Vorschläge und bekannte Orte, dann OpenStreetMap ---
  const inBounds = (lat, lng) => lat > MAXB[0][0] && lat < MAXB[1][0] && lng > MAXB[0][1] && lng < MAXB[1][1];
  const STOP = new Set(["the", "and", "und", "der", "die", "das", "von", "mit", "zum", "zur", "bei", "nach", "auf", "am", "im"]);
  const normTxt = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim();
  const GAZ = [];
  IDEAS.filter((i) => hasIdeaPos(i) && !i.ap).forEach((i) => GAZ.push([i.t.replace(/\(.*?\)/g, " "), i.la, i.ln]));
  cities.forEach(([n, lat, lng]) => GAZ.push([n, lat, lng]));
  parkNames.forEach(([n, lat, lng]) => GAZ.push([n, lat, lng]));
  (TRIP.places || []).forEach((x) => GAZ.push(x)); // zusätzliche Orte nur für die Suche
  const GAZ_N = GAZ.map(([n, lat, lng]) => ({ n: n.trim(), lat, lng, toks: normTxt(n).split(" ").filter((t) => t.length > 1 && !STOP.has(t)) }))
    .filter((g) => g.toks.length);

  // Treffer, wenn alle Wörter eines bekannten Ortes in der Eingabe vorkommen; der genaueste Ort gewinnt
  function localFind(q) {
    const qt = new Set(normTxt(q).split(" "));
    let best = null, bestScore = 0;
    GAZ_N.forEach((g) => {
      if (!g.toks.every((t) => qt.has(t))) return;
      const score = g.toks.length * 100 + g.toks.join("").length;
      if (score > bestScore) { best = g; bestScore = score; }
    });
    return best ? { lat: best.lat, lng: best.lng, label: best.n.slice(0, 80) } : null;
  }

  async function osmFind(q) {
    if (!q) return null;
    const vb = [MAXB[0][1], MAXB[1][0], MAXB[1][1], MAXB[0][0]].join(",");
    const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&bounded=1" +
      (TRIP.countrycodes ? "&countrycodes=" + TRIP.countrycodes : "") +
      "&viewbox=" + vb + "&accept-language=de&q=" + encodeURIComponent(q);
    const r = await fetch(url, { headers: { Accept: "application/json" } });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || !j[0]) return null;
    const lat = Number(j[0].lat), lng = Number(j[0].lon);
    if (!isFinite(lat) || !isFinite(lng) || !inBounds(lat, lng)) return null;
    return { lat, lng, label: String(j[0].name || j[0].display_name || "").split(",")[0].slice(0, 80) };
  }

  async function geocode(name, place) {
    const local = (place && localFind(place)) || (name && localFind(name));
    if (local) return local;
    try { return (await osmFind(place)) || (await osmFind(name)); } catch (e) { return null; }
  }

  async function locate(id, name, place, quiet) {
    locating.add(id); render();
    const found = await geocode(name, place);
    locating.delete(id);
    if (found) {
      const fields = { lat: found.lat, lng: found.lng };
      if (!place && found.label) fields.place = found.label;
      justPinned = id;
      const ok = await updateAct(id, fields, "„" + name + "“ ist auf der Karte. Zieh die Nadel, falls die Stelle nicht genau passt.");
      if (ok && mapOpen) map.flyTo([found.lat, found.lng], Math.max(map.getZoom(), 10), { duration: 0.9 }); // versteckte Karte nicht bewegen
    } else {
      render();
      setStatus("Für „" + name + "“ wurde kein Ort gefunden. Öffne den Tag, gib einen genaueren Ort ein oder setz die Nadel per Klick.", true);
    }
  }

  // Roadtrip: der erste Tag bekommt die Nadel zur Ortsangabe, die übrigen Tage füllt ihr selbst
  async function planTrip(tripId, days, name, place) {
    if (place) {
      const f = await geocode("", place);
      if (f) { justPinned = days[0].id; await updateAct(days[0].id, { lat: f.lat, lng: f.lng }); }
    }
    setStatus("Roadtrip „" + name + "“ gespeichert. Öffne die Tage im Zeitstrahl, gib pro Tag einen Ort ein und tippe auf „Nadel suchen“.");
  }

  // --- Eintragen (die einzige Eingabe für neue Events) ---
  $("act-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const name = $("act-name").value.trim(), place = $("act-place").value.trim();
    const start = $("act-day").value, end = multi ? $("act-end").value : "";
    if (!name) { setStatus("Gib zuerst ein Event ein.", true); $("act-name").focus(); return; }
    if (multi && !start) { setStatus("Wähle bei „von“ den ersten Tag.", true); $("act-day").focus(); return; }
    if (multi && !end) { setStatus("Wähle bei „bis“ den letzten Tag.", true); $("act-end").focus(); return; }
    if (multi && dayIdx(end) <= dayIdx(start)) { setStatus("„bis“ muss nach dem ersten Tag liegen. Für einen einzelnen Tag wähle „Ein Tag“.", true); $("act-end").focus(); return; }
    const btn = $("btn-add"); btn.disabled = true;
    const by = await myId();
    const now = Date.now();

    if (end && dayIdx(end) > dayIdx(start)) {
      // Roadtrip über mehrere Tage: ein Eintrag pro Tag
      const color = trips.length % 6;
      const range = DAYS.slice(dayIdx(start), dayIdx(end) + 1);
      const trip = { name, place, start, end, color, at: now };
      if (by) trip.by = by;
      const days = [];
      let tripId;
      try {
        if (db) { const ref = tripCol().doc(); await ref.set(trip); tripId = ref.id; }
        else { tripId = "local-trip-" + now; trips.push({ id: tripId, ...trip }); }
        for (let k = 0; k < range.length; k++) {
          const doc = { name: name + " · Tag " + (k + 1), place, day: range[k].iso, tripId, time: "", note: "", lat: null, lng: null, at: now + k + 1 };
          if (by) doc.by = by;
          let id;
          if (db) { const ref = col().doc(); await ref.set(doc); id = ref.id; }
          else { id = "local-" + now + "-" + k; acts.push({ id, ...doc }); }
          days.push({ id, iso: range[k].iso });
        }
      } catch (e) {
        btn.disabled = false; failWrite(e); return;
      }
      resetForm(); btn.disabled = false;
      setStatus("Roadtrip „" + name + "“ gespeichert (" + range.length + " Tage). Die Stopps werden geplant …");
      flashDetail = true;
      openDayAt(start, true);
      planTrip(tripId, days, name, place);
      return;
    }

    const doc = { name, place, day: start, time: "", note: "", lat: null, lng: null, at: now };
    if (by) doc.by = by;
    let id;
    if (db) {
      try { const ref = col().doc(); await ref.set(doc); id = ref.id; }
      catch (e) { btn.disabled = false; failWrite(e); return; }
    } else {
      id = "local-" + now;
      acts.push({ id, ...doc });
    }
    resetForm(); btn.disabled = false;
    setStatus("„" + name + "“ gespeichert. Die Nadel wird gesucht …");
    if (start) { flashDetail = true; openDayAt(start, true); } else render();
    locate(id, name, place);
  });

  function resetForm() { $("act-name").value = ""; $("act-place").value = ""; $("act-end").value = ""; }
  function failWrite(e) {
    if (e && e.code === "invalid_argument") { canWrite = false; $("act-form").hidden = true; setStatus("Du kannst hier nur ansehen, nicht eintragen.", true); }
    else if (e && e.code === "quota_exceeded") setStatus("Der Speicher ist voll. Löscht ein paar alte Einträge.", true);
    else setStatus("Speichern hat nicht geklappt. Versuch es gleich noch mal.", true);
  }

  // --- Zugang per PIN und gemeinsamer Speicher (Supabase) ---
  // Die PIN wird nirgends gespeichert: Aus ihr wird der Schlüssel des Plans berechnet.
  // Jede Anfrage schickt diesen Schlüssel mit; die Datenbank gibt nur Einträge mit genau diesem Schlüssel heraus.
  const SALT = (TRIP.id || "urlaub") + ":";
  const POLL_MS = 4000;
  const local = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} },
  };
  let api = null;
  const KEY_NAME = (TRIP.id || "urlaub") + "-name", KEY_PIN = (TRIP.id || "urlaub") + "-pin";

  async function planKey(pin) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT + pin));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 40);
  }

  function connect(key) {
    const cfg = window.SUPABASE_CONFIG;
    if (!cfg || !cfg.url || !cfg.key) throw { code: "no-config" };
    const base = cfg.url.replace(/\/+$/, "") + "/rest/v1/";
    const headers = { apikey: cfg.key, "x-plan": key, "Content-Type": "application/json" };
    if (cfg.key.startsWith("eyJ")) headers.Authorization = "Bearer " + cfg.key; // ältere „anon“-Schlüssel
    api = async (path, opts = {}) => {
      const r = await fetch(base + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
      if (!r.ok) throw { code: r.status === 401 || r.status === 403 ? "denied" : "http", status: r.status };
      return r.status === 204 || opts.method && opts.method !== "GET" ? null : r.json();
    };
  }

  // Kleine Hülle, damit der Rest der Seite mit db.collection(...).doc(...) arbeiten kann
  function makeDb(key) {
    const caches = {}, listeners = {};
    const refreshers = [];
    const kick = () => refreshers.forEach((f) => f());
    return {
      collection(name) {
        const cache = caches[name] || (caches[name] = new Map());
        return {
          doc(id) {
            const docId = id || (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
            return {
              id: docId,
              async set(d) {
                await api(name, { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
                  body: JSON.stringify({ id: docId, plan: key, data: d, at: Number(d.at) || 0 }) });
                cache.set(docId, d); kick();
              },
              async update(fields) {
                const next = { ...(cache.get(docId) || {}), ...fields };
                await api(name + "?id=eq." + encodeURIComponent(docId), { method: "PATCH", headers: { Prefer: "return=minimal" },
                  body: JSON.stringify({ data: next, at: Number(next.at) || 0 }) });
                cache.set(docId, next); kick();
              },
              async delete() {
                await api(name + "?id=eq." + encodeURIComponent(docId), { method: "DELETE", headers: { Prefer: "return=minimal" } });
                cache.delete(docId); kick();
              },
            };
          },
          orderBy() {
            return {
              onSnapshot(next, err) {
                let last = "", busy = false, failed = 0;
                const load = async () => {
                  if (busy) return; busy = true;
                  try {
                    const rows = await api(name + "?select=id,data&order=at.asc");
                    failed = 0;
                    const sig = JSON.stringify(rows);
                    if (sig !== last) {
                      last = sig;
                      cache.clear(); rows.forEach((r) => cache.set(r.id, r.data));
                      next({ docs: rows.map((r) => ({ id: r.id, data: () => r.data })) });
                    }
                  } catch (e) { if (++failed === 3 && err) err(e); }
                  busy = false;
                };
                refreshers.push(load);
                listeners[name] = setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
                document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
                load();
                return () => clearInterval(listeners[name]);
              },
            };
          },
        };
      },
    };
  }

  async function openPlan(pin, create) {
    const key = await planKey(pin);
    connect(key);
    const found = await api("plaene?select=key&key=eq." + key);
    if (!found.length) {
      if (!create) return "missing";
      await api("plaene", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ key }) });
    }
    db = makeDb(key);
    subscribe();
    return "ok";
  }

  function subscribe() {
    const onErr = () => setStatus("Die Verbindung zum Speicher hakt. Prüf das Internet; die Seite versucht es weiter.", true);
    tripCol().orderBy("at").onSnapshot((snap) => {
      trips = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((t) => typeof t.name === "string");
      render();
    }, onErr);
    col().orderBy("at").onSnapshot((snap) => {
      acts = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((a) => typeof a.name === "string");
      acts.forEach((a) => { if (a.by) names[a.by] = a.by; });
      render();
    }, onErr);
  }

  // --- PIN-Fenster ---
  let creating = false;
  const gateMsg = (t) => { $("gate-msg").textContent = t || ""; };
  function setCreating(on) {
    creating = on;
    $("gate-pin2-wrap").hidden = !on;
    $("gate-new").hidden = true;
    $("gate-btn").textContent = on ? "Plan anlegen" : "Öffnen";
    $("gate-text").textContent = on
      ? "Wiederhole die PIN. Merkt sie euch gut: Ohne sie kommt niemand mehr an den Plan."
      : "Gib eure 4-stellige PIN ein.";
  }
  function enter(name, pin, remember) {
    me = name;
    local.set(KEY_NAME, name);
    local.set(KEY_PIN, remember ? pin : null);
    $("who").textContent = name;
    $("gate").hidden = true;
    document.body.classList.remove("locked");
    setStatus("");
    setTimeout(() => map.invalidateSize(), 50);
  }
  function explain(e) {
    if (e && e.code === "no-config") return "Der Speicher ist noch nicht eingerichtet. Trag die Zugangsdaten in supabase-config.js ein (siehe ANLEITUNG).";
    if (e && e.code === "denied") return "Der Speicher hat den Zugriff verweigert. Prüf den Schlüssel in supabase-config.js.";
    return "Keine Verbindung zum Speicher. Prüf das Internet und versuch es noch einmal.";
  }

  $("gate-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pin = $("gate-pin").value.trim(), name = $("gate-name").value.trim();
    if (!/^\d{4}$/.test(pin)) { gateMsg("Die PIN hat genau 4 Ziffern."); $("gate-pin").focus(); return; }
    if (!name) { gateMsg("Trag deinen Namen ein, damit ihr seht, wer was eingetragen hat."); $("gate-name").focus(); return; }
    if (creating && $("gate-pin2").value.trim() !== pin) { gateMsg("Die beiden PINs stimmen nicht überein."); $("gate-pin2").focus(); return; }
    $("gate-btn").disabled = true; gateMsg("");
    try {
      const res = await openPlan(pin, creating);
      if (res === "missing") {
        gateMsg("Zu dieser PIN gibt es keinen Plan. Prüf die PIN oder leg einen neuen Plan an.");
        $("gate-new").hidden = false;
      } else {
        enter(name, pin, $("gate-remember").checked);
      }
    } catch (e) { gateMsg(explain(e)); }
    $("gate-btn").disabled = false;
  });
  $("gate-new").onclick = () => { gateMsg(""); setCreating(true); $("gate-pin2").focus(); };
  $("logout").onclick = () => { local.set(KEY_PIN, null); location.reload(); };

  async function gate() {
    $("gate-name").value = local.get(KEY_NAME) || "";
    const pin = local.get(KEY_PIN), name = local.get(KEY_NAME);
    if (pin && name) {
      $("gate-text").textContent = "Einen Moment, der Plan wird geöffnet …";
      try { if ((await openPlan(pin, false)) === "ok") { enter(name, pin, true); return; } } catch (e) {}
      local.set(KEY_PIN, null);
    }
    setCreating(false);
    $("gate-pin").focus();
  }

  render();
  gate();
})();
</script>
</body>
</html>
